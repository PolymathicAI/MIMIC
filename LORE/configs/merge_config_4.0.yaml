# LORE 4.0 — merge configuration (the exact config behind the public release).
#
# Archival copy of the generated `merge_config.yaml` that sat alongside the released
# parquet. Only `name:` was changed, from the internal build name to the release name
# `lore`; everything else is verbatim. Regenerated by 03_merge/02_merge_script.py from
# tokenize_config.yaml — do not hand-edit if you are re-running the pipeline.
#
# Reading guide:
#   modalities                     -> merged into a subset whenever present
#   mutually_exclusive_modalities  -> at most ONE per subset. This is why subsets are
#                                     not disjoint: a transcript with both atac and
#                                     cage data is emitted once per assay, into two
#                                     different subsets. Deduplicate on the anchor id.
#   extra_validations              -> curated eval-only subsets (val/ split only)
#   length_splits                  -> token-length buckets used for webdataset shards
#   tokenizer_versions             -> must match the tokenizers shipped in `mimic`
version: 4.0
master_id_version: 3.0
name: lore
fmt: parquet
seed: 42
length_splits: [0, 200, 245, 301, 370, 455, 559, 687, 845, 1038, 1275, 1567, 1925,
  2366, 2907, 3571, 4388, 5391, 6624, 8139, 10000, 100000]
val_length_splits: [0, 455, 1038, 2366, 4388, 10000, 100000]
min_split_size: 200
samples_per_tar: 4096
max_val_samples: 8000
extra_validations:
  coding_class:
    id_filename: val_coding_class.parquet
    modalities: [rna_seq, is_coding, feature_type, gene_family_txt]
  funcprot_caption:
    id_filename: val_funcprot_caption.parquet
    modalities: [aa_seq, funcprot_caption]
  rna_codons:
    id_filename: val_rna_codons.parquet
    modalities: [aa_seq, rna_codons, gene_family_txt]
  rasp_human:
    id_filename: val_rasp_human.parquet
    modalities: [rasp2, rna_seq, phylop_human, splice_jctns_5cls, gene_family_txt]
  rasp_mouse:
    id_filename: val_rasp_mouse.parquet
    modalities: [rasp2, rna_seq, phylop_mouse, splice_jctns_5cls, gene_family_txt]
  splice_prediction:
    id_filename: val_splice_prediction.parquet
    modalities: [rna_seq, splice_jctns_5cls, gene_family_txt]
  prot_abund:
    id_filename: val_prot_abund.parquet
    modalities: [prot_abund, aa_seq]
  atac:
    id_filename: val_atac.parquet
    modalities: [rna_seq, atac, gene_family_txt]
  aa_forward_eval:
    id_filename: val_aa_forward_eval.parquet
    modalities: [aa_seq, masif, sasa, dssp, prot_struct]
  corpus:
    skip_merge: true
    modalities: [corpus]
  cage:
    id_filename: val_cage.parquet
    modalities: [rna_seq, cage, gene_family_txt]
  transcription:
    id_filename: val_transcription.parquet
    modalities: [aa_seq, rna_seq, cds_junctions, gene_family_txt]
required_modalities: [aa_seq, rna_seq]
git_test_config:
  num_splits: 2
  num_subsets: 2
  samples_per_split: 4
modalities:
  aa_seq:
    version: v4_plddt_70_tok
    merge_key: uniprot_id
    tokenizer_versions:
      aa_seq: '1.0'
    column_mapping:
      sequence: aa_seq
  dssp:
    version: v4_plddt_70_tok
    merge_key: uniprot_id
    tokenizer_versions:
      dssp: '1.0'
    column_mapping:
      dssp: dssp
  sasa:
    version: v4_plddt_70_tok
    merge_key: uniprot_id
    tokenizer_versions:
      sasa: '1.3'
    column_mapping:
      sasa: sasa
  masif:
    version: v4_10m_tok
    merge_key: uniprot_id
    prepend_text: masif_
    tokenizer_versions:
      masif_n_vertices: '1.3'
      masif_si_index: '1.3'
      masif_charge: '1.3'
      masif_hbond: '1.3'
      masif_hydrophobicity: '1.3'
    column_mapping:
      n_vertices: masif_n_vertices
      si_index: masif_si_index
      charge: masif_charge
      hbond: masif_hbond
      hydrophobicity: masif_hydrophobicity
  prot_struct:
    version: afdb70_esm3_tok
    merge_key: uniprot_id
    tokenizer_versions:
      prot_struct: esm3_v0
    column_mapping:
      tokens: prot_struct
  funcprot_caption:
    version: 1.2_tok
    merge_key: uniprot_id
    tokenizer_versions:
      funcprot_caption: '1.3'
    column_mapping:
      funcprot_caption: funcprot_caption
  rna_codons:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      rna_codons: '1.0'
    column_mapping:
      rna_codons: rna_codons
  phylop_human:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      phylop_human: '1.4'
    column_mapping:
      phylop: phylop_human
  phylop_mouse:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      phylop_mouse: '1.4'
    column_mapping:
      phylop: phylop_mouse
  rna_seq:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      rna_seq: '1.0'
    column_mapping:
      rna_seq: rna_seq
  splice_jctns_5cls:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      splice_jctns_5cls: '1.0'
    column_mapping:
      splice_jctns_5cls: splice_jctns_5cls
  splice_regions:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      splice_regions: '1.1'
    column_mapping:
      splice_regions: splice_regions
  cds_junctions:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      cds_junctions: '1.0'
    column_mapping:
      CDS_junctions: cds_junctions
  gene_family_txt:
    version: 1.4.1_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      gene_family_txt: '1.3'
    column_mapping:
      text: gene_family_txt
  is_coding:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      is_coding: '1.0'
    column_mapping:
      is_coding: is_coding
  feature_type:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      feature_type: '1.0'
    column_mapping:
      feature_type: feature_type
mutually_exclusive_modalities:
  prot_abund:
    version: 1.1_tok
    merge_key: uniprot_id
    tokenizer_versions:
      prot_abund: '1.3'
      context: '1.3'
    column_mapping:
      prot_abund: prot_abund
      context: context
  rasp2:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      rasp2: '1.3'
      context: '1.3'
    column_mapping:
      rasp2: rasp2
      context: context
  atac:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      atac: '1.0'
      context: '1.3'
    column_mapping:
      atac: atac
      context: context
  cage:
    version: 1.4_tok
    merge_key: genome_feature_id
    tokenizer_versions:
      context: '1.3'
      cage: '1.0'
    column_mapping:
      context: context
      cage: cage
standalone_modalities:
  corpus:
    version: biobert_tok_1.1
    make_splits: true
