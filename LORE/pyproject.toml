[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Tooling for LORE, the dataset MIMIC was trained on. Installed separately from the
# `mimic` inference package so that analysing the data does not pull in torch:
#   pip install "git+https://github.com/PolymathicAI/MIMIC.git#subdirectory=LORE"
name = "lore"
version = "0.1.0"
description = "LORE: the multimodal central-dogma dataset behind MIMIC — index, queries, and build pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polymathic AI" }]
keywords = ["biology", "dataset", "multimodal", "DNA", "RNA", "protein", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Deliberately light: `import lore` and the whole index/query API need neither torch nor
# the tokenizers. Install `mimic` alongside to detokenize payload into sequences, or the
# `pipeline` extra to re-run the build (that one does pull torch, via webdataset).
dependencies = [
    "pyarrow>=14",
    "duckdb>=0.10",
    "huggingface-hub>=0.24",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

# Needed only to RE-RUN the build pipeline in `pipeline/`, not to use the dataset.
# Installable subset; see pipeline/README.md for the four that are not pip-friendly
# (pymesh, ete3, foldcomp, pyBigWig) and are needed by single stages only.
pipeline = [
    "biopython>=1.80",
    "biotite>=1.0",
    "datasets>=2.14",
    "gffutils>=0.12",
    "h5py>=3.8",
    "ijson>=3.2",
    "matplotlib>=3.7",
    "matplotlib-venn>=0.11",
    "pandas>=2.0",
    "polars>=0.20",
    "pyfaidx>=0.7",
    "requests>=2.28",
    "scipy>=1.10",
    "tokenizers>=0.15",
    "transformers>=4.40",
    "typer>=0.9",
    # Stage 03 writes webdataset shards (pulls torch) and tokenizes with MIMIC's own
    # tokenizers and modality registry.
    "webdataset>=0.2",
    "mimic @ git+https://github.com/PolymathicAI/MIMIC.git",
]

[project.urls]
Homepage = "https://github.com/PolymathicAI/MIMIC"
Dataset = "https://huggingface.co/datasets/polymathic-ai/LORE"
Model = "https://huggingface.co/polymathic-ai/MIMIC"

[tool.hatch.build.targets.wheel]
packages = ["src/lore"]

[tool.hatch.build.targets.sdist]
include = ["/src/lore", "/configs", "/README.md", "/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
