[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI is `mimic-cd` (central dogma); `mimic` was taken.
# The import package is still `mimic` (i.e. `from mimic import load_pretrained`).
name = "mimic-cd"
version = "0.1.0"
description = "MIMIC: a generative multimodal foundation model for biomolecules (inference, embedding, and generation)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Polymathic AI" }]
keywords = ["biology", "foundation-model", "multimodal", "DNA", "RNA", "protein", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core runtime: kept intentionally minimal. Everything below is small next to
# torch/x-transformers; heavier, modality-specific deps live in the extras.
dependencies = [
    "torch>=2.2",
    "x-transformers>=2.0",
    "einops>=0.7",
    "numpy>=1.24",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "loguru>=0.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Protein-structure modality (ESM3 VQVAE tokenizer): biotite for structure I/O.
structure = [
    "biotite>=1.0",
    "typing_extensions>=4.0",
]
# Free-text / semantic-context modality: BioBERT tokenizer + embeddings.
text = [
    "transformers>=4.40",
]
all = [
    "mimic-cd[structure,text]",
]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/PolymathicAI/MIMIC"
Repository = "https://github.com/PolymathicAI/MIMIC"
Paper = "https://arxiv.org/abs/2604.24506"
Weights = "https://huggingface.co/polymathic-ai/MIMIC"

# src-layout: map src/mimic -> the importable `mimic` package. All files under
# it (incl. the small per-modality .npy/.npz tokenizer bin tables) are included.
[tool.hatch.build.targets.wheel]
packages = ["src/mimic"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mimic",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
