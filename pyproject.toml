[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Import and distribution name is `mimic` (i.e. `from mimic import load_pretrained`).
# Install from GitHub:
#   pip install git+https://github.com/PolymathicAI/MIMIC.git
name = "mimic"
version = "0.1.0"
description = "MIMIC: a generative multimodal foundation model for biomolecules (inference, embedding, and generation)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Polymathic AI" }]
keywords = ["biology", "foundation-model", "multimodal", "DNA", "RNA", "protein", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core runtime. Includes the deps for every modality so the full model works
# out of the box: transformers (free-text / semantic-context BioBERT tokenizer)
# and biotite (protein-structure I/O for the ESM3 VQVAE tokenizer).
dependencies = [
    "torch>=2.2",
    "x-transformers>=2.0",
    "einops>=0.7",
    "numpy>=1.24",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "loguru>=0.7",
    "tqdm>=4.65",
    "transformers>=4.40",
    "biotite>=1.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
# `all` is kept as an alias of the core install for backward compatibility.
all = [
    "mimic",
]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/PolymathicAI/MIMIC"
Repository = "https://github.com/PolymathicAI/MIMIC"
Paper = "https://arxiv.org/abs/2604.24506"
Weights = "https://huggingface.co/polymathic-ai/MIMIC"

# src-layout: map src/mimic -> the importable `mimic` package. All files under
# it (incl. the small per-modality .npy/.npz tokenizer bin tables) are included.
[tool.hatch.build.targets.wheel]
packages = ["src/mimic"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mimic",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
